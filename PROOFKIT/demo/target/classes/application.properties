server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/proofkit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# NEW: shows error messages (like "Email already registered") to the frontend
server.error.include-message=always

# NEW: JWT secret. Must be at least 32 characters. Change it before going live.
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-chars